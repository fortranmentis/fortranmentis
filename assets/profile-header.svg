  <title id="title">fortranmentis — Scientific data, AI agents and spatial tools</title>
  <desc id="desc">Climate and ocean analysis, data engineering, AI agents, native apps and developer tools. An illustrative network connects climate and spatial data to AI with explicit rules, mobile apps and server tools. It represents project areas, not measured results.</desc>
